name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  EXPO_NO_TELEMETRY: 1

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build Heavenly runtime map
        run: node --no-warnings --experimental-strip-types scripts/maps/build-heavenly-runtime-map.mjs

      - name: Validate Heavenly OSM data
        run: node --no-warnings --experimental-strip-types scripts/maps/validate-heavenly-osm.mjs

      - name: Check whitespace errors
        run: git diff --check

      - name: Verify generated data is current
        run: git diff --exit-code

      - name: Build web app
        run: npm run build:web
